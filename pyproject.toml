[project]
name = "readmission"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RayaneBelfilali", email = "rbelfilli@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.67.1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.4.6",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.3",
    "shap>=0.51.0",
    "xgboost>=2.0",
]

[project.scripts]
readmission = "readmission:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
]
